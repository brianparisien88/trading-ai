name: TEMP investigate transfers

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r sync/requirements.txt
      - working-directory: sync
        env:
          ZERION_API_KEY: ${{ secrets.ZERION_API_KEY }}
          ONCHAIN_WALLET: ${{ vars.ONCHAIN_WALLET }}
          ONCHAIN_CHAINS: ${{ vars.ONCHAIN_CHAINS }}
        run: python investigate_transfers.py
