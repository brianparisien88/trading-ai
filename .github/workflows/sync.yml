name: Sync IBKR trades to Supabase

# Deterministic ETL: pull IBKR Flex report -> FIFO-pair -> upsert to Supabase.
# No LLM, no interactive auth. Runs daily (also keeps the free-tier Supabase
# project warm so it doesn't auto-pause).

on:
  schedule:
    # 12:00 UTC (~08:00 ET) — after IBKR's overnight batch finalises the prior
    # trading day's Flex statement. Running earlier (e.g. just after the close)
    # gets a statement that still ends the *previous* day, so same-day trades
    # would lag two days instead of one.
    - cron: '0 12 * * *'
  workflow_dispatch:        # manual "Run workflow" button

concurrency:
  group: ibkr-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_ZERION: ${{ secrets.ZERION_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r sync/requirements.txt
      - name: Run sync
        working-directory: sync
        env:
          FLEX_TOKEN: ${{ secrets.FLEX_TOKEN }}
          FLEX_QUERY_ID: ${{ vars.FLEX_QUERY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python sync.py

      - name: Run onchain sync
        if: ${{ env.HAS_ZERION == 'true' }}
        working-directory: sync
        env:
          ZERION_API_KEY: ${{ secrets.ZERION_API_KEY }}
          ONCHAIN_WALLET: ${{ vars.ONCHAIN_WALLET }}
          ONCHAIN_CHAINS: ${{ vars.ONCHAIN_CHAINS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python onchain.py
