name: Sync IBKR trades to Supabase

# Deterministic ETL: pull IBKR Flex report -> FIFO-pair -> upsert to Supabase.
# No LLM, no interactive auth. Runs daily (also keeps the free-tier Supabase
# project warm so it doesn't auto-pause).

on:
  schedule:
    # Primary: 12:16 UTC (~08:16 ET) — after IBKR's overnight batch finalises
    # the prior trading day's Flex statement (see docs/BUILD-PLAYBOOK.md / the
    # sync-timing history). Off the :00 mark on purpose: GitHub documents that
    # scheduled workflows can be delayed under high load, and the top of every
    # hour is the worst of it (every repo's `0 * * * *`-style cron collides at
    # once) — observed a 14-minute delay on 2026-09-02 at the old `0 12 * * *`.
    - cron: '16 12 * * *'
    # Fallback: 12:30 UTC, 14 minutes later. Runs check_synced.py first, which
    # only lets the real sync proceed if today's primary tick never landed
    # (missed/delayed past this point) — see the "Check" step below. Matches
    # the observed worst-case delay above, so it should rarely actually fire;
    # `concurrency` below means even a false-positive double-trigger just
    # queues harmlessly behind the primary run rather than racing it.
    - cron: '30 12 * * *'
  workflow_dispatch:        # manual "Run workflow" button — always syncs, no check

concurrency:
  group: ibkr-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r sync/requirements.txt

      - name: Check whether today's sync already ran (fallback tick only)
        id: check
        if: github.event.schedule == '30 12 * * *'
        working-directory: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: echo "result=$(python check_synced.py)" >> "$GITHUB_OUTPUT"

      - name: Run sync
        if: steps.check.outputs.result != 'skip'
        working-directory: sync
        env:
          FLEX_TOKEN: ${{ secrets.FLEX_TOKEN }}
          FLEX_QUERY_ID: ${{ vars.FLEX_QUERY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python sync.py
